[project]
name = "datasmith"
version = "0.1.0"
description = "sikap datasmith: Databento .dbn.zst → canonical parquet"
requires-python = ">=3.12"
dependencies = [
    "core",
    "pyarrow>=16",
    "databento>=0.46",
    "tqdm>=4.66",
]

[project.scripts]
datasmith = "datasmith.cli:main"

[tool.uv.sources]
core = { path = "../core", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datasmith"]
