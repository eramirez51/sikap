[project]
name = "tui"
version = "0.1.0"
description = "sikap tui: Textual + Pillow + Kitty graphics frontend"
requires-python = ">=3.12"
dependencies = [
    "core",
    "native",
    "textual>=0.83",
]

[project.scripts]
sikap-tui = "tui.app:main"

[tool.uv.sources]
core   = { path = "../core",   editable = true }
native = { path = "../native", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tui"]
