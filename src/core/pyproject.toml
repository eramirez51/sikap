[project]
name = "core"
version = "0.1.0"
description = "sikap core: pure replay engine"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=16",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
